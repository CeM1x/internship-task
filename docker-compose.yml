services:
  db:
    image: postgres:16
    container_name: db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DRAMATIQ_BROKER: redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: dramatiq app.workers.reports
    container_name: worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DRAMATIQ_BROKER: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
